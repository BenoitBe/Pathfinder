<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Pathfinder">
  <defs>
    <radialGradient id="mSky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>
    <linearGradient id="mGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0603a"/>
      <stop offset="100%" stop-color="#5e2f1c"/>
    </linearGradient>
    <linearGradient id="mGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0cb84"/>
      <stop offset="100%" stop-color="#a06f2e"/>
    </linearGradient>
    <clipPath id="mCard"><rect x="1" y="1" width="46" height="46" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#mCard)">
    <rect width="48" height="48" fill="url(#mSky)"/>
    <g fill="#9fb6d4" opacity=".8">
      <circle cx="9" cy="9" r="0.6"/><circle cx="38" cy="12" r="0.5"/><circle cx="24" cy="7" r="0.5"/>
      <circle cx="15" cy="17" r="0.45"/><circle cx="41" cy="24" r="0.5"/>
    </g>
    <path d="M-2 36 Q24 27 50 36 L50 50 L-2 50 Z" fill="url(#mGround)"/>
    <ellipse cx="24" cy="35.6" rx="12" ry="1.6" fill="#000" opacity=".35"/>
    <!-- rover -->
    <line x1="17" y1="23" x2="16" y2="15" stroke="#aab0b8" stroke-width="0.9"/>
    <circle cx="16" cy="14.4" r="1.2" fill="#dfe3e8"/>
    <polygon points="12,22 37,20 36,23 11,25" fill="#2c3a58"/>
    <polygon points="14,25 34,25 32,31 16,31" fill="url(#mGold)"/>
    <g stroke="#aab0b8" stroke-width="1.1" stroke-linecap="round">
      <path d="M15,34 L24,28M24,34 L24,28M33,34 L24,28M15,34 L33,34"/>
    </g>
    <g fill="#42424a" stroke="#1c1c22" stroke-width="0.5">
      <circle cx="15" cy="34.5" r="3.6"/><circle cx="24" cy="34.5" r="3.6"/><circle cx="33" cy="34.5" r="3.6"/>
    </g>
    <g fill="#7c7c86">
      <circle cx="15" cy="34.5" r="1.1"/><circle cx="24" cy="34.5" r="1.1"/><circle cx="33" cy="34.5" r="1.1"/>
    </g>
  </g>
  <rect x="1" y="1" width="46" height="46" rx="10" fill="none" stroke="#3c6082" stroke-opacity=".7"/>
